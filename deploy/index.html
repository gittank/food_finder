<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #fff;
      color: #000;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: #000;
      color: #fff;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    header p {
      color: #999;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 2.5rem 3rem;
    }

    .filters {
      padding: 0;
      margin-bottom: 2rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filters input {
      flex: 1;
      min-width: 200px;
      padding: 0.7rem 1rem;
      border: 1px solid #d4d4d4;
      border-radius: 0;
      font-size: 0.85rem;
      font-family: inherit;
      color: #000;
      background: #fff;
      transition: border-color 0.2s;
    }

    .filters input:focus {
      outline: none;
      border-color: #000;
    }

    .filters input::placeholder {
      color: #999;
    }

    .filters select {
      padding: 0.7rem 1rem;
      border: 1px solid #d4d4d4;
      border-radius: 0;
      font-size: 0.85rem;
      font-family: inherit;
      color: #000;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .filters select:focus {
      outline: none;
      border-color: #000;
    }

    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 2rem;
      border-bottom: 1px solid #e5e5e5;
    }

    .tab {
      padding: 0.9rem 1.8rem;
      border: none;
      background: transparent;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #666;
      transition: all 0.2s;
    }

    .tab:hover {
      color: #000;
    }

    .tab.active {
      color: #000;
      border-bottom-color: #000;
      font-weight: 500;
    }

    .tab .count {
      font-size: 0.75rem;
      margin-left: 0.4rem;
      color: inherit;
      opacity: 0.6;
    }

    .tab.active .count {
      opacity: 0.8;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: #fff;
      overflow: hidden;
      cursor: pointer;
      transition: opacity 0.2s;
      position: relative;
      border: 1px solid #f0f0f0;
    }

    .product-card:hover {
      opacity: 0.85;
    }

    .product-image {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #f7f7f7;
      padding: 1.5rem;
    }

    .product-info {
      padding: 1.2rem 1rem;
      border-top: 1px solid #f0f0f0;
    }

    .product-title {
      font-weight: 400;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      color: #000;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .product-price {
      color: #000;
      font-weight: 500;
      font-size: 1rem;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      font-size: 0.7rem;
      margin-top: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 500;
      border: 1px solid;
    }

    .badge-featured {
      background: transparent;
      color: #8b6914;
      border-color: #d4b44a;
    }

    .badge-suitable {
      background: transparent;
      color: #2d6a30;
      border-color: #6abf6e;
    }

    .badge-unsuitable {
      background: transparent;
      color: #a12020;
      border-color: #e06060;
    }

    .badge-noingredients {
      background: transparent;
      color: #b45309;
      border-color: #e8a040;
    }

    .badge-ocr {
      background: transparent;
      color: #555;
      border-color: #ccc;
      font-size: 0.65rem;
    }

    .badge-source {
      background: transparent;
      color: #666;
      border-color: #ccc;
      font-size: 0.65rem;
    }

    .btn {
      display: inline-block;
      background: #000;
      color: #fff;
      padding: 0.7rem 1.5rem;
      border-radius: 0;
      text-decoration: none;
      font-weight: 500;
      font-family: inherit;
      border: 1px solid #000;
      cursor: pointer;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #333;
      border-color: #333;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #fff;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-between;
      align-items: start;
    }

    .modal-header h2 {
      font-size: 1.1rem;
      font-weight: 400;
      padding-right: 1rem;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #999;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #000;
    }

    .modal-body {
      padding: 2rem;
    }

    .modal-images {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
    }

    .modal-image {
      width: 80px;
      height: 80px;
      object-fit: contain;
      background: #f7f7f7;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .modal-image.active {
      border-color: #000;
    }

    .modal-main-image {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      background: #f7f7f7;
      margin-bottom: 1.5rem;
    }

    .modal-section {
      margin-bottom: 1.5rem;
    }

    .modal-section h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .ingredients-list {
      background: #f7f7f7;
      padding: 1rem;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #333;
    }

    .restricted-list {
      background: #faf0f0;
      padding: 1rem;
      color: #a12020;
      font-size: 0.85rem;
      border-left: 3px solid #a12020;
    }

    .no-results {
      text-align: center;
      padding: 4rem 2rem;
      color: #999;
      grid-column: 1 / -1;
      font-size: 0.9rem;
    }

    .info-row {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .info-item {
      flex: 1;
      min-width: 150px;
    }

    .info-item p {
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .container { padding: 1.5rem 1rem; }
      header { padding: 1.5rem 1rem; }
      header h1 { font-size: 1.4rem; }
      .products { gap: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Food Finder</h1>
    <p>Vegetarian products without eggs, onions, garlic, scallions, or leeks</p>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab" data-tab="featured">
        Featured <span class="count" id="featured-count">0</span>
      </button>
      <button class="tab active" data-tab="suitable">
        Suitable <span class="count" id="suitable-count">0</span>
      </button>
    </div>

    <div class="filters">
      <input type="text" id="search" placeholder="Search products...">
      <select id="source-filter">
        <option value="">All Sources</option>
      </select>
    </div>

    <div class="products" id="products-grid">
      <!-- Products will be inserted here -->
    </div>
  </div>


  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Product Name</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <img id="modal-main-image" class="modal-main-image" src="" alt="">

        <div class="modal-images" id="modal-images">
          <!-- Thumbnails will be inserted here -->
        </div>

        <div class="info-row">
          <div class="info-item modal-section">
            <h3>Price</h3>
            <p id="modal-price">-</p>
          </div>
          <div class="info-item modal-section">
            <h3>Source</h3>
            <p id="modal-source">-</p>
          </div>
        </div>

        <div class="modal-section" id="ingredients-section">
          <h3>Ingredients</h3>
          <div class="ingredients-list" id="modal-ingredients">-</div>
        </div>

        <div class="modal-section" id="restricted-section" style="display: none;">
          <h3>Restricted Ingredients Found</h3>
          <div class="restricted-list" id="modal-restricted">-</div>
        </div>

        <div class="modal-section">
          <a id="modal-link" href="#" target="_blank" class="btn">View Product</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allData = { featured: [], suitable: [] };
    let currentTab = 'suitable';
    let currentProducts = [];
    let currentModalProduct = null;

    async function loadData() {
      try {
        const response = await fetch('./data/products.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        allData = await response.json();

        const sources = new Set();
        for (const cat of ['featured', 'suitable']) {
          (allData[cat] || []).forEach(p => { if (p.source) sources.add(p.source); });
        }
        const select = document.getElementById('source-filter');
        const currentValue = select.value;
        select.innerHTML = '<option value="">All Sources</option>';
        Array.from(sources).sort().forEach(s => {
          select.innerHTML += `<option value="${s}">${s}</option>`;
        });
        select.value = currentValue;

        updateCounts();
        showTab(currentTab);
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('products-grid').innerHTML =
          '<div class="no-results">Error loading products. Check that data/products.json exists.</div>';
      }
    }

    function updateCounts() {
      document.getElementById('featured-count').textContent = allData.featured?.length || 0;
      document.getElementById('suitable-count').textContent = allData.suitable?.length || 0;
    }

    function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });

      currentProducts = allData[tab] || [];

      const sourceFilter = document.getElementById('source-filter').value;
      if (sourceFilter) {
        currentProducts = currentProducts.filter(p => p.source === sourceFilter);
      }

      const query = document.getElementById('search').value.toLowerCase();
      if (query) {
        currentProducts = currentProducts.filter(p =>
          p.title?.toLowerCase().includes(query) ||
          p.ingredients?.toLowerCase().includes(query)
        );
      }

      renderProducts(currentProducts);
    }

    function renderProducts(items) {
      const grid = document.getElementById('products-grid');

      if (items.length === 0) {
        grid.innerHTML = '<div class="no-results">No products found</div>';
        return;
      }

      grid.innerHTML = items.map((product, index) => {
        let badgeClass = 'badge-suitable';
        let badgeText = 'Vegetarian Friendly';

        if (currentTab === 'featured') {
          badgeClass = 'badge-featured';
          badgeText = 'Featured';
        }

        const ocrBadge = product.ingredientSource === 'ocr' && product.ocrConfidence
          ? `<span class="badge badge-ocr">OCR ${Math.round(product.ocrConfidence)}%</span>`
          : '';

        return `
        <div class="product-card" onclick="openModal(${index})">
          <img
            class="product-image"
            src="${product.imageUrl || 'https://via.placeholder.com/300x200?text=No+Image'}"
            alt="${product.title}"
            onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'"
          >
          <div class="product-info">
            <div class="product-title">${product.title || 'Unknown Product'}</div>
            <div class="product-price">${product.price || '-'}</div>
            <span class="badge ${badgeClass}">${badgeText}</span>
            <span class="badge badge-source">${product.source || 'Unknown'}</span>
            ${ocrBadge}
          </div>
        </div>
      `}).join('');
    }

    function openModal(index) {
      const product = currentProducts[index];
      currentModalProduct = product;

      document.getElementById('modal-title').textContent = product.title || 'Unknown Product';
      document.getElementById('modal-price').textContent = product.price || '-';
      const sourceLabel = product.source || 'Unknown';
      const ingredientMethod = product.ingredientSource === 'ocr'
        ? ` (OCR ${Math.round(product.ocrConfidence || 0)}%)`
        : '';
      document.getElementById('modal-source').textContent = sourceLabel + ingredientMethod;

      const mainImg = document.getElementById('modal-main-image');
      mainImg.src = product.imageUrl || product.images?.[0] || '';

      const imagesContainer = document.getElementById('modal-images');
      if (product.images && product.images.length > 1) {
        imagesContainer.innerHTML = product.images.map((img, i) => `
          <img
            class="modal-image ${i === 0 ? 'active' : ''}"
            src="${img}"
            onclick="selectImage(this, '${img}')"
            onerror="this.style.display='none'"
          >
        `).join('');
        imagesContainer.style.display = 'flex';
      } else {
        imagesContainer.style.display = 'none';
      }

      const ingredientsSection = document.getElementById('ingredients-section');
      const ingredientsDiv = document.getElementById('modal-ingredients');
      if (product.ingredients) {
        ingredientsDiv.textContent = product.ingredients;
        ingredientsSection.style.display = 'block';
      } else {
        ingredientsDiv.textContent = 'No ingredients data available';
        ingredientsSection.style.display = 'block';
      }

      const restrictedSection = document.getElementById('restricted-section');
      const restrictedDiv = document.getElementById('modal-restricted');
      const restricted = product.analysis?.restrictedFound || [];
      const nonVeg = product.analysis?.nonVegFound || [];
      const allRestricted = [...restricted, ...nonVeg];

      if (allRestricted.length > 0) {
        restrictedDiv.textContent = allRestricted.join(', ');
        restrictedSection.style.display = 'block';
      } else {
        restrictedSection.style.display = 'none';
      }

      const link = document.getElementById('modal-link');
      link.href = product.productUrl || '#';
      link.textContent = product.source ? `View on ${product.source}` : 'View Product';

      document.getElementById('modal').classList.add('active');
    }

    function selectImage(thumb, src) {
      document.getElementById('modal-main-image').src = src;
      document.querySelectorAll('.modal-image').forEach(img => img.classList.remove('active'));
      thumb.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      currentModalProduct = null;
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => showTab(tab.dataset.tab));
    });

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    document.getElementById('search').addEventListener('input', () => {
      showTab(currentTab);
    });

    document.getElementById('source-filter').addEventListener('change', () => {
      showTab(currentTab);
    });

    loadData();
  </script>
</body>
</html>
