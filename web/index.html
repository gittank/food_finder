<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #fff;
      color: #000;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: #000;
      color: #fff;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    header p {
      color: #999;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 2.5rem 3rem;
    }

    .filters {
      padding: 0;
      margin-bottom: 2rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filters input {
      flex: 1;
      min-width: 200px;
      padding: 0.7rem 1rem;
      border: 1px solid #d4d4d4;
      border-radius: 0;
      font-size: 0.85rem;
      font-family: inherit;
      color: #000;
      background: #fff;
      transition: border-color 0.2s;
    }

    .filters input:focus {
      outline: none;
      border-color: #000;
    }

    .filters input::placeholder {
      color: #999;
    }

    .filters select {
      padding: 0.7rem 1rem;
      border: 1px solid #d4d4d4;
      border-radius: 0;
      font-size: 0.85rem;
      font-family: inherit;
      color: #000;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .filters select:focus {
      outline: none;
      border-color: #000;
    }

    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 2rem;
      border-bottom: 1px solid #e5e5e5;
    }

    .tab {
      padding: 0.9rem 1.8rem;
      border: none;
      background: transparent;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #666;
      transition: all 0.2s;
    }

    .tab:hover {
      color: #000;
    }

    .tab.active {
      color: #000;
      border-bottom-color: #000;
      font-weight: 500;
    }

    .tab .count {
      font-size: 0.75rem;
      margin-left: 0.4rem;
      color: inherit;
      opacity: 0.6;
    }

    .tab.active .count {
      opacity: 0.8;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: #fff;
      overflow: hidden;
      cursor: pointer;
      transition: opacity 0.2s;
      position: relative;
      border: 1px solid #f0f0f0;
    }

    .product-card:hover {
      opacity: 0.85;
    }

    .product-card.selected {
      outline: 2px solid #000;
    }

    .product-checkbox {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      z-index: 10;
      accent-color: #000;
    }

    .product-image {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #f7f7f7;
      padding: 1.5rem;
      padding-left: 2.5rem;
    }

    .product-info {
      padding: 1.2rem 1rem;
      border-top: 1px solid #f0f0f0;
    }

    .product-title {
      font-weight: 400;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      color: #000;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .product-price {
      color: #000;
      font-weight: 500;
      font-size: 1rem;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      font-size: 0.7rem;
      margin-top: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 500;
      border: 1px solid;
    }

    .badge-featured {
      background: transparent;
      color: #8b6914;
      border-color: #d4b44a;
    }

    .badge-suitable {
      background: transparent;
      color: #2d6a30;
      border-color: #6abf6e;
    }

    .badge-unsuitable {
      background: transparent;
      color: #a12020;
      border-color: #e06060;
    }

    .badge-noingredients {
      background: transparent;
      color: #b45309;
      border-color: #e8a040;
    }

    .badge-ocr {
      background: transparent;
      color: #555;
      border-color: #ccc;
      font-size: 0.65rem;
    }

    .badge-source {
      background: transparent;
      color: #666;
      border-color: #ccc;
      font-size: 0.65rem;
    }

    /* Action bar */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #000;
      padding: 1rem 2rem;
      display: none;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .action-bar.active {
      display: flex;
    }

    .action-bar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .selected-count {
      font-weight: 500;
      color: #fff;
      font-size: 0.85rem;
    }

    .action-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      display: inline-block;
      background: #000;
      color: #fff;
      padding: 0.7rem 1.5rem;
      border-radius: 0;
      text-decoration: none;
      font-weight: 500;
      font-family: inherit;
      border: 1px solid #000;
      cursor: pointer;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #333;
      border-color: #333;
    }

    .btn-secondary {
      background: transparent;
      color: #000;
      border: 1px solid #d4d4d4;
    }

    .btn-secondary:hover {
      background: #f5f5f5;
      border-color: #999;
    }

    .btn-success {
      background: #2d6a30;
      border-color: #2d6a30;
    }

    .btn-success:hover {
      background: #1e5420;
      border-color: #1e5420;
    }

    .btn-danger {
      background: #a12020;
      border-color: #a12020;
    }

    .btn-danger:hover {
      background: #801818;
      border-color: #801818;
    }

    .btn-warning {
      background: #b45309;
      border-color: #b45309;
    }

    .btn-warning:hover {
      background: #8a4007;
      border-color: #8a4007;
    }

    .btn-featured {
      background: #8b6914;
      border-color: #8b6914;
    }

    .btn-featured:hover {
      background: #6d530f;
      border-color: #6d530f;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #fff;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-between;
      align-items: start;
    }

    .modal-header h2 {
      font-size: 1.1rem;
      font-weight: 400;
      padding-right: 1rem;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #999;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #000;
    }

    .modal-body {
      padding: 2rem;
    }

    .modal-images {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
    }

    .modal-image {
      width: 80px;
      height: 80px;
      object-fit: contain;
      background: #f7f7f7;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .modal-image.active {
      border-color: #000;
    }

    .modal-main-image {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      background: #f7f7f7;
      margin-bottom: 1.5rem;
    }

    .modal-section {
      margin-bottom: 1.5rem;
    }

    .modal-section h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .ingredients-list {
      background: #f7f7f7;
      padding: 1rem;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #333;
    }

    .restricted-list {
      background: #faf0f0;
      padding: 1rem;
      color: #a12020;
      font-size: 0.85rem;
      border-left: 3px solid #a12020;
    }

    .modal-footer {
      padding: 1rem 2rem;
      border-top: 1px solid #e5e5e5;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .no-results {
      text-align: center;
      padding: 4rem 2rem;
      color: #999;
      grid-column: 1 / -1;
      font-size: 0.9rem;
    }

    .info-row {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .info-item {
      flex: 1;
      min-width: 150px;
    }

    .info-item p {
      font-size: 0.9rem;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #fff;
      padding: 0.8rem 1.5rem;
      z-index: 2000;
      display: none;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
    }

    .toast.active {
      display: block;
    }

    .toast.success {
      background: #2d6a30;
    }

    .toast.error {
      background: #a12020;
    }

    /* Add padding at bottom for action bar */
    body.has-selection {
      padding-bottom: 80px;
    }

    @media (max-width: 768px) {
      .container { padding: 1.5rem 1rem; }
      header { padding: 1.5rem 1rem; }
      header h1 { font-size: 1.4rem; }
      .products { gap: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Food Finder</h1>
    <p>Vegetarian products without eggs, onions, garlic, scallions, or leeks</p>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab" data-tab="featured">
        Featured <span class="count" id="featured-count">0</span>
      </button>
      <button class="tab active" data-tab="suitable">
        Suitable <span class="count" id="suitable-count">0</span>
      </button>
      <button class="tab" data-tab="unsuitable">
        Unsuitable <span class="count" id="unsuitable-count">0</span>
      </button>
      <button class="tab" data-tab="noIngredients">
        Needs Review <span class="count" id="noingredients-count">0</span>
      </button>
    </div>

    <div class="filters">
      <input type="text" id="search" placeholder="Search products...">
      <select id="source-filter">
        <option value="">All Sources</option>
      </select>
      <button class="btn btn-secondary" onclick="selectAll()">Select All</button>
      <button class="btn btn-secondary" onclick="selectNone()">Clear Selection</button>
    </div>

    <div class="products" id="products-grid">
      <!-- Products will be inserted here -->
    </div>
  </div>

  <!-- Action bar for selected items -->
  <div class="action-bar" id="action-bar">
    <div class="action-bar-left">
      <span class="selected-count"><span id="selected-count">0</span> selected</span>
      <button class="btn btn-secondary" onclick="selectNone()">Clear</button>
    </div>
    <div class="action-buttons">
      <button class="btn btn-featured" onclick="moveToCategory('featured')">Mark Featured</button>
      <button class="btn btn-success" onclick="moveToCategory('suitable')">Mark Suitable</button>
      <button class="btn btn-danger" onclick="moveToCategory('unsuitable')">Mark Unsuitable</button>
      <button class="btn btn-warning" onclick="moveToCategory('noIngredients')">Mark Needs Review</button>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Product Name</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <img id="modal-main-image" class="modal-main-image" src="" alt="">

        <div class="modal-images" id="modal-images">
          <!-- Thumbnails will be inserted here -->
        </div>

        <div class="info-row">
          <div class="info-item modal-section">
            <h3>Price</h3>
            <p id="modal-price">-</p>
          </div>
          <div class="info-item modal-section">
            <h3>Source</h3>
            <p id="modal-source">-</p>
          </div>
        </div>

        <div class="modal-section" id="ingredients-section">
          <h3>Ingredients</h3>
          <div class="ingredients-list" id="modal-ingredients">-</div>
        </div>

        <div class="modal-section" id="restricted-section" style="display: none;">
          <h3>Restricted Ingredients Found</h3>
          <div class="restricted-list" id="modal-restricted">-</div>
        </div>

        <div class="modal-section">
          <h3>Edit Image URL</h3>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="modal-image-url" placeholder="Enter image URL..." style="flex: 1; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
            <button class="btn btn-secondary" onclick="updateProductImage()">Update</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <a id="modal-link" href="#" target="_blank" class="btn">View Product</a>
        <button class="btn btn-featured" onclick="moveModalProductTo('featured')">Mark Featured</button>
        <button class="btn btn-success" onclick="moveModalProductTo('suitable')">Mark Suitable</button>
        <button class="btn btn-danger" onclick="moveModalProductTo('unsuitable')">Mark Unsuitable</button>
        <button class="btn btn-warning" onclick="moveModalProductTo('noIngredients')">Needs Review</button>
      </div>
    </div>
  </div>

  <script>
    let allData = { featured: [], suitable: [], unsuitable: [], noIngredients: [] };
    let currentTab = 'suitable';
    let currentProducts = [];
    let selectedProducts = new Set(); // Set of "source-id" keys
    let pendingChanges = []; // Array of { product, fromCategory, toCategory }
    let currentModalProduct = null;

    // Load data from API
    async function loadData() {
      try {
        const response = await fetch('/api/products');
        allData = await response.json();

        // Populate source filter
        const sources = new Set();
        for (const cat of ['featured', 'suitable', 'unsuitable', 'noIngredients']) {
          (allData[cat] || []).forEach(p => { if (p.source) sources.add(p.source); });
        }
        const select = document.getElementById('source-filter');
        const currentValue = select.value;
        select.innerHTML = '<option value="">All Sources</option>';
        Array.from(sources).sort().forEach(s => {
          select.innerHTML += `<option value="${s}">${s}</option>`;
        });
        select.value = currentValue;

        updateCounts();
        showTab(currentTab);
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('products-grid').innerHTML =
          '<div class="no-results">Error loading products. Make sure the server is running.</div>';
      }
    }

    function updateCounts() {
      document.getElementById('featured-count').textContent = allData.featured?.length || 0;
      document.getElementById('suitable-count').textContent = allData.suitable?.length || 0;
      document.getElementById('unsuitable-count').textContent = allData.unsuitable?.length || 0;
      document.getElementById('noingredients-count').textContent = allData.noIngredients?.length || 0;
    }

    function getProductKey(product) {
      return `${product.source}-${product.id}`;
    }

    function showTab(tab) {
      currentTab = tab;

      // Update tab buttons
      document.querySelectorAll('.tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });

      // Get products for current tab
      currentProducts = allData[tab] || [];

      // Apply source filter
      const sourceFilter = document.getElementById('source-filter').value;
      if (sourceFilter) {
        currentProducts = currentProducts.filter(p => p.source === sourceFilter);
      }

      // Apply search filter if any
      const query = document.getElementById('search').value.toLowerCase();
      if (query) {
        currentProducts = currentProducts.filter(p =>
          p.title?.toLowerCase().includes(query) ||
          p.ingredients?.toLowerCase().includes(query)
        );
      }

      renderProducts(currentProducts);
    }

    function renderProducts(items) {
      const grid = document.getElementById('products-grid');

      if (items.length === 0) {
        grid.innerHTML = '<div class="no-results">No products found</div>';
        return;
      }

      grid.innerHTML = items.map((product, index) => {
        const key = getProductKey(product);
        const isSelected = selectedProducts.has(key);

        let badgeClass = 'badge-suitable';
        let badgeText = 'Vegetarian Friendly';

        if (currentTab === 'featured') {
          badgeClass = 'badge-featured';
          badgeText = 'Featured';
        } else if (currentTab === 'unsuitable') {
          badgeClass = 'badge-unsuitable';
          const restricted = product.analysis?.restrictedFound || [];
          const nonVeg = product.analysis?.nonVegFound || [];
          badgeText = [...restricted, ...nonVeg].join(', ') || 'Contains restricted';
        } else if (currentTab === 'noIngredients') {
          badgeClass = 'badge-noingredients';
          badgeText = 'Needs ingredient review';
        }

        const ocrBadge = product.ingredientSource === 'ocr' && product.ocrConfidence
          ? `<span class="badge badge-ocr">OCR ${Math.round(product.ocrConfidence)}%</span>`
          : '';

        return `
        <div class="product-card ${isSelected ? 'selected' : ''}" data-key="${key}">
          <input
            type="checkbox"
            class="product-checkbox"
            ${isSelected ? 'checked' : ''}
            onclick="toggleSelection(event, '${key}')"
          >
          <img
            class="product-image"
            src="${product.imageUrl || 'https://via.placeholder.com/300x200?text=No+Image'}"
            alt="${product.title}"
            onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'"
            onclick="openModal(${index})"
          >
          <div class="product-info" onclick="openModal(${index})">
            <div class="product-title">${product.title || 'Unknown Product'}</div>
            <div class="product-price">${product.price || '-'}</div>
            <span class="badge ${badgeClass}">${badgeText}</span>
            <span class="badge badge-source">${product.source || 'Unknown'}</span>
            ${ocrBadge}
          </div>
        </div>
      `}).join('');
    }

    function toggleSelection(event, key) {
      event.stopPropagation();
      if (selectedProducts.has(key)) {
        selectedProducts.delete(key);
      } else {
        selectedProducts.add(key);
      }
      updateSelectionUI();
      renderProducts(currentProducts);
    }

    function selectAll() {
      currentProducts.forEach(p => selectedProducts.add(getProductKey(p)));
      updateSelectionUI();
      renderProducts(currentProducts);
    }

    function selectNone() {
      selectedProducts.clear();
      updateSelectionUI();
      renderProducts(currentProducts);
    }

    function updateSelectionUI() {
      const count = selectedProducts.size;
      document.getElementById('selected-count').textContent = count;
      document.getElementById('action-bar').classList.toggle('active', count > 0);
      document.body.classList.toggle('has-selection', count > 0);
    }

    async function moveToCategory(toCategory) {
      if (selectedProducts.size === 0) return;

      const changes = [];

      // Find all selected products and their current categories
      for (const key of selectedProducts) {
        let found = false;
        for (const fromCategory of ['featured', 'suitable', 'unsuitable', 'noIngredients']) {
          const product = allData[fromCategory]?.find(p => getProductKey(p) === key);
          if (product && fromCategory !== toCategory) {
            changes.push({
              productId: product.id,
              source: product.source,
              fromCategory,
              toCategory
            });
            found = true;
            break;
          }
        }
      }

      if (changes.length === 0) {
        showToast('No changes to save', 'error');
        return;
      }

      try {
        const response = await fetch('/api/products/move', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ changes })
        });

        const result = await response.json();

        if (response.ok) {
          showToast(`Moved ${changes.length} product(s) to ${toCategory}`, 'success');
          selectedProducts.clear();
          updateSelectionUI();
          // Reload data to reflect changes
          await loadData();
        } else {
          showToast(result.error || 'Failed to save changes', 'error');
        }
      } catch (error) {
        console.error('Error saving changes:', error);
        showToast('Error saving changes', 'error');
      }
    }

    async function moveModalProductTo(toCategory) {
      if (!currentModalProduct) return;

      const key = getProductKey(currentModalProduct);
      let fromCategory = null;

      // Find current category
      for (const cat of ['featured', 'suitable', 'unsuitable', 'noIngredients']) {
        if (allData[cat]?.find(p => getProductKey(p) === key)) {
          fromCategory = cat;
          break;
        }
      }

      if (!fromCategory || fromCategory === toCategory) {
        showToast('Product is already in this category', 'error');
        return;
      }

      try {
        const response = await fetch('/api/products/move', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            changes: [{
              productId: currentModalProduct.id,
              source: currentModalProduct.source,
              fromCategory,
              toCategory
            }]
          })
        });

        const result = await response.json();

        if (response.ok) {
          showToast(`Moved to ${toCategory}`, 'success');
          closeModal();
          await loadData();
        } else {
          showToast(result.error || 'Failed to move product', 'error');
        }
      } catch (error) {
        console.error('Error moving product:', error);
        showToast('Error moving product', 'error');
      }
    }

    function showToast(message, type = '') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast active ' + type;
      setTimeout(() => toast.classList.remove('active'), 3000);
    }

    function openModal(index) {
      const product = currentProducts[index];
      currentModalProduct = product;

      document.getElementById('modal-title').textContent = product.title || 'Unknown Product';
      document.getElementById('modal-price').textContent = product.price || '-';
      const sourceLabel = product.source || 'Unknown';
      const ingredientMethod = product.ingredientSource === 'ocr'
        ? ` (OCR ${Math.round(product.ocrConfidence || 0)}%)`
        : '';
      document.getElementById('modal-source').textContent = sourceLabel + ingredientMethod;

      // Main image
      const mainImg = document.getElementById('modal-main-image');
      mainImg.src = product.imageUrl || product.images?.[0] || '';

      // Image thumbnails
      const imagesContainer = document.getElementById('modal-images');
      if (product.images && product.images.length > 1) {
        imagesContainer.innerHTML = product.images.map((img, i) => `
          <img
            class="modal-image ${i === 0 ? 'active' : ''}"
            src="${img}"
            onclick="selectImage(this, '${img}')"
            onerror="this.style.display='none'"
          >
        `).join('');
        imagesContainer.style.display = 'flex';
      } else {
        imagesContainer.style.display = 'none';
      }

      // Ingredients
      const ingredientsSection = document.getElementById('ingredients-section');
      const ingredientsDiv = document.getElementById('modal-ingredients');
      if (product.ingredients) {
        ingredientsDiv.textContent = product.ingredients;
        ingredientsSection.style.display = 'block';
      } else {
        ingredientsDiv.textContent = 'No ingredients data available';
        ingredientsSection.style.display = 'block';
      }

      // Restricted ingredients
      const restrictedSection = document.getElementById('restricted-section');
      const restrictedDiv = document.getElementById('modal-restricted');
      const restricted = product.analysis?.restrictedFound || [];
      const nonVeg = product.analysis?.nonVegFound || [];
      const allRestricted = [...restricted, ...nonVeg];

      if (allRestricted.length > 0) {
        restrictedDiv.textContent = allRestricted.join(', ');
        restrictedSection.style.display = 'block';
      } else {
        restrictedSection.style.display = 'none';
      }

      // Link
      const link = document.getElementById('modal-link');
      link.href = product.productUrl || '#';
      link.textContent = product.source ? `View on ${product.source}` : 'View Product';

      document.getElementById('modal').classList.add('active');
    }

    function selectImage(thumb, src) {
      document.getElementById('modal-main-image').src = src;
      document.querySelectorAll('.modal-image').forEach(img => img.classList.remove('active'));
      thumb.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      currentModalProduct = null;
    }

    async function updateProductImage() {
      if (!currentModalProduct) return;

      const imageUrl = document.getElementById('modal-image-url').value.trim();
      if (!imageUrl) {
        showToast('Please enter an image URL', 'error');
        return;
      }

      try {
        const response = await fetch('/api/products/update-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productId: currentModalProduct.id,
            source: currentModalProduct.source,
            imageUrl
          })
        });

        const result = await response.json();

        if (response.ok) {
          showToast('Image updated', 'success');
          document.getElementById('modal-main-image').src = imageUrl;
          document.getElementById('modal-image-url').value = '';
          await loadData();
        } else {
          showToast(result.error || 'Failed to update image', 'error');
        }
      } catch (error) {
        console.error('Error updating image:', error);
        showToast('Error updating image', 'error');
      }
    }

    // Tab click handlers
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => showTab(tab.dataset.tab));
    });

    // Close modal on overlay click
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    // Close modal on escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Search filter
    document.getElementById('search').addEventListener('input', () => {
      showTab(currentTab);
    });

    // Source filter
    document.getElementById('source-filter').addEventListener('change', () => {
      showTab(currentTab);
    });

    // Load data on page load
    loadData();
  </script>
</body>
</html>
